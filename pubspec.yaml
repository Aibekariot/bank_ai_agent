name: bank_ai_agent
description: "Демо-банк: тестовое приложение для ИИ-ассистента Элдик Банка."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  # Модуль чата ассистента: его же подключит настоящее приложение банка.
  eldik_assistant:
    path: packages/eldik_assistant


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/sokolAI2.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/sokolAI2.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/sokolAI2.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/sokolAI2.png"

flutter:
  uses-material-design: true
